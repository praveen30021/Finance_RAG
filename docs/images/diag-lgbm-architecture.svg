<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="LightGBM architecture"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="540" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">LightGBM — Full Training Pipeline</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Two independent cuts to the O(#data × #features) bill, then leaf-wise growth on histograms</text><rect x="380" y="78" width="200" height="36" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="480.0" y="100.5" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">TRAINING DATA</text><path d="M 440 114 V 134 H 230 V 154" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 520 114 V 134 H 730 V 154" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="60" y="154" width="340" height="112" rx="10" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="230" y="176" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">GOSS  —  fewer ROWS</text><text x="82" y="198" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• keep ALL rows with large |gradient|</text><text x="82" y="216" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• sample b% of the small-gradient rows</text><text x="82" y="234" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• amplify those by (1 − a)/b  ⟹ unbiased</text><text x="230" y="256" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">#data ↓↓</text><rect x="560" y="154" width="340" height="112" rx="10" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="730" y="176" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9" text-anchor="middle">EFB  —  fewer FEATURES</text><text x="582" y="198" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• find mutually exclusive sparse columns</text><text x="582" y="216" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• bundle them via disjoint offsets</text><text x="582" y="234" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• greedy graph colouring, conflict rate γ</text><text x="730" y="256" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6d28d9" text-anchor="middle">#features ↓↓</text><path d="M 230 266 V 288 H 480 V 306" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 730 266 V 288 H 480" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="306" width="360" height="56" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="480.0" y="329.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">HISTOGRAM CONSTRUCTION</text><text x="480.0" y="347.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">~255 bins per feature  ·  + subtraction trick</text><line x1="480" y1="362" x2="480" y2="384" stroke="#9aa4ae" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300" y="384" width="360" height="60" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="480.0" y="400.875" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">LEAF-WISE TREE GROWTH</text><text x="480.0" y="418.375" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">always split the leaf with the MAXIMUM gain</text><text x="480.0" y="435.875" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">capped by num_leaves and min_data_in_leaf</text><line x1="480" y1="444" x2="480" y2="464" stroke="#9aa4ae" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300" y="464" width="360" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="480.0" y="485.375" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">ADD TREE:   Fₘ = Fₘ₋₁ + ν · hₘ</text><path d="M 300 481 H 250 V 334 H 300" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="214" y="410" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="start">repeat</text><text x="214" y="424" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a" text-anchor="start">n_estimators</text><text x="480" y="520" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#57606a" text-anchor="middle">Categorical features are handled natively — no one-hot needed (see §1.6)</text></svg>