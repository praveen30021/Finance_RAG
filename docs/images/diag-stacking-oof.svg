2563eb" text-anchor="middle">Fold 1</text><text x="265.0" y="337" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">train on</text><rect x="342" y="304" width="138" height="40" rx="7" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/><text x="411.0" y="323" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">Fold 2</text><text x="411.0" y="337" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">train on</text><rect x="488" y="304" width="138" height="40" rx="7" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/><text x="557.0" y="323" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">Fold 3</text><text x="557.0" y="337" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">train on</text><rect x="634" y="304" width="138" height="40" rx="7" fill="#fff7e6" stroke="#b45309" stroke-width="2"/><text x="703.0" y="323" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">Fold 4</text><text x="703.0" y="337" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">PREDICT ON</text><line x1="784" y1="324" x2="808" y2="324" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><text x="816" y="329" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#15803d" text-anchor="start">OOF_4</text><rect x="188" y="104" width="592" height="240" rx="10" fill="none" stroke="#d8dee4" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M 888 126 V 318" fill="none" stroke="#15803d" stroke-width="1.6" stroke-linecap="ro