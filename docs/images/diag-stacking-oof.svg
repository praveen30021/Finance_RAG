<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-label="Out-of-fold predictions in stacking"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="530" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Stacking — Out-of-Fold (OOF) Predictions</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Every row gets a prediction from a model that never saw it. This is what kills the leakage.</text><text x="180" y="94" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9" text-anchor="start">Train set (800 rows) split into K = 4 folds</text><text x="180" y="138" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606a" text-anchor="end">Iteration 1</text><rect x="196" y="112" width="138" height="40" rx="7" fill="#fff7e6" stroke="#b45309" stroke-width="2"/><text x="265.0" y="131" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">Fold 1</text><text x="265.0" y="145" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">PREDICT ON</text><rect x="342" y="112" width="138" height="40" rx="7" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/><text x="411.0" y="131" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">Fold 2</text><text x="411.0" y="145" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" fon