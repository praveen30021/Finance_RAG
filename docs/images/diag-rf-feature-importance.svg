<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="How feature importance is computed in a tree"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Feature Importance — worked example (MDI)</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Each node's importance is its weighted impurity drop; a feature's importance is its share of the total</text><rect x="175.0" y="92" width="250" height="74" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="300" y="112" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#2563eb" text-anchor="middle">ROOT — split on Column 0</text><text x="300" y="129" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10.8" fill="#1f2328" text-anchor="middle">Nt = 5,  impurity = 0.48</text><text x="300" y="146" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10.8" fill="#1f2328" text-anchor="middle">left: 1 row, imp 0    right: 4 rows, imp 0.375</text><line x1="300" y1="166" x2="190" y2="196" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="300" y1="166" x2="410" y2="196" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><rect x="130" y="196" width="120" height="34" rx="7" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.3"/><text x="190" y="218" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">leaf</text><rect x="325.0" y="196" width="210" height="56" rx="9" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="430" y="216" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#b45309" text-anchor="middle">NODE — split on Column 1</text><text x="430" y="233" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10.8" fill="#1f2328" text-anchor="middle">its node importance = 0.30</text><line x1="430" y1="252" x2="370" y2="282" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="430" y1="252" x2="490" y2="282" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><rect x="334" y="282" width="72" height="30" rx="6" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="370" y="302" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">leaf</text><rect x="454" y="282" width="72" height="30" rx="6" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="490" y="302" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">leaf</text><rect x="596" y="86" width="290" height="230" rx="10" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><text x="616" y="110" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start">Root node importance</text><text x="616" y="130" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2328" text-anchor="start">NI = (5/5) × [ 0.48 −</text><text x="616" y="147" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2328" text-anchor="start">       ( (4/5)(0.375) + (1/5)(0) ) ]</text><text x="616" y="164" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2328" text-anchor="start">    = 0.48 − 0.30</text><text x="616" y="181" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2328" text-anchor="start">    = 0.18          ← call this Y</text><line x1="616" y1="206" x2="866" y2="206" stroke="#e4e8ec" stroke-width="1.2" stroke-linecap="round"/><text x="616" y="226" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="start">Second node importance</text><text x="616" y="246" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2328" text-anchor="start">NI = 0.30            ← call this X</text><line x1="616" y1="262" x2="866" y2="262" stroke="#e4e8ec" stroke-width="1.2" stroke-linecap="round"/><text x="616" y="282" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f2328" text-anchor="start">Shares of the total (X + Y = 0.48)</text><text x="616" y="302" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#2563eb" text-anchor="start">Col 0 = 0.18/0.48 = 0.375</text><text x="616" y="302" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2328" text-anchor="start"></text><text x="760" y="302" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#b45309" text-anchor="start">Col 1 = 0.625</text><text x="40" y="358" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">Resulting importances</text><text x="40" y="393" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="start">Column 0</text><rect x="130" y="380" width="520" height="20" rx="4" fill="#f1f4f8"/><rect x="130" y="380" width="195.0" height="20" rx="4" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/><text x="140" y="394" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="start">0.375</text><text x="40" y="427" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="start">Column 1</text><rect x="130" y="414" width="520" height="20" rx="4" fill="#f1f4f8"/><rect x="130" y="414" width="325.0" height="20" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.4"/><text x="140" y="428" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="start">0.625</text><text x="668" y="400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="start">they always sum to 1.0</text><text x="668" y="418" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="start">RF averages this over all trees</text></svg>