<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Multi-layer stacking"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Multi-Layer Stacking</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">You are not limited to one meta layer — Kaggle winners have used 64 models in layer 1</text><text x="40" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start">LAYER 0  —  base models</text><rect x="300" y="84" width="170" height="38" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="385.0" y="107.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Linear Regression</text><rect x="490" y="84" width="170" height="38" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="575.0" y="107.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Decision Tree</text><rect x="680" y="84" width="170" height="38" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="765.0" y="107.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">KNN</text><line x1="385" y1="122" x2="385" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="385" y1="122" x2="575" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="385" y1="122" x2="765" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="575" y1="122" x2="385" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="575" y1="122" x2="575" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="575" y1="122" x2="765" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="765" y1="122" x2="385" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="765" y1="122" x2="575" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="765" y1="122" x2="765" y2="192" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><text x="40" y="210" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="start">LAYER 1  —  intermediate</text><rect x="300" y="192" width="170" height="38" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="385.0" y="215.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Model M4</text><rect x="490" y="192" width="170" height="38" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="575.0" y="215.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Model M5</text><rect x="680" y="192" width="170" height="38" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="765.0" y="215.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Model M6</text><line x1="385" y1="230" x2="575" y2="300" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="575" y1="230" x2="575" y2="300" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><line x1="765" y1="230" x2="575" y2="300" stroke="#d8dee4" stroke-width="1" stroke-linecap="round"/><text x="40" y="318" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6d28d9" text-anchor="start">LAYER 2  —  final meta model</text><rect x="490" y="300" width="170" height="38" rx="8" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="575.0" y="323.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Neural Network</text><text x="40" y="130" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a" text-anchor="start">their outputs</text><text x="40" y="144" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a" text-anchor="start">feed layer 1</text><text x="40" y="238" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a" text-anchor="start">+ optionally the</text><text x="40" y="252" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a" text-anchor="start">original features</text><rect x="40" y="346" width="820" height="40" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="450" y="362" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">⚠️ Every extra layer needs its own fold split — managing those folds is the hard part.</text><text x="450" y="378" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#57606a" text-anchor="middle">In practice two layers is almost always enough; the gains after that are tiny.</text></svg>