<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Symmetric oblivious trees"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">CatBoost — Symmetric (Oblivious) Trees</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Every node at the same depth uses the SAME split, so prediction becomes one array lookup</text><rect x="28" y="80" width="420" height="292" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><text x="238" y="108" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="middle">NORMAL (asymmetric) tree</text><rect x="167.0" y="128" width="142" height="32" rx="7" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="238" y="149" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">Age &lt; 30 ?</text><line x1="238" y1="160" x2="142" y2="186" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="238" y1="160" x2="334" y2="186" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><rect x="67.0" y="186" width="150" height="32" rx="7" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="142" y="207" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">Income &lt; 50k ?</text><rect x="259.0" y="186" width="150" height="32" rx="7" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="334" y="207" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">City = Delhi ?</text><text x="238" y="304" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#57606a" text-anchor="middle">different features on each branch</text><line x1="142" y1="218" x2="96" y2="256" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="68" y="256" width="56" height="26" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="96" y="274" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#57606a" text-anchor="middle">w1</text><line x1="142" y1="218" x2="188" y2="256" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="160" y="256" width="56" height="26" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="188" y="274" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#57606a" text-anchor="middle">w2</text><line x1="334" y1="218" x2="288" y2="256" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="260" y="256" width="56" height="26" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="288" y="274" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#57606a" text-anchor="middle">w3</text><line x1="334" y1="218" x2="380" y2="256" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="352" y="256" width="56" height="26" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="380" y="274" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#57606a" text-anchor="middle">w4</text><text x="238" y="330" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">✔ more expressive per tree</text><text x="238" y="352" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">✘ prediction = a chain of if/else branches</text><rect x="468" y="80" width="464" height="292" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><text x="700" y="108" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#15803d" text-anchor="middle">OBLIVIOUS (symmetric) tree</text><rect x="629.0" y="128" width="142" height="32" rx="7" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="700" y="149" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">Age &lt; 30 ?</text><line x1="700" y1="160" x2="590" y2="186" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="700" y1="160" x2="810" y2="186" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><rect x="515.0" y="186" width="150" height="32" rx="7" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="590" y="207" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">Income &lt; 50k ?</text><rect x="735.0" y="186" width="150" height="32" rx="7" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="810" y="207" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">Income &lt; 50k ?</text><rect x="516" y="176" width="368" height="52" rx="9" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="700" y="304" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">SAME split on both sides — one question per LEVEL</text><line x1="590" y1="218" x2="544" y2="258" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="516" y="258" width="56" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.2"/><text x="544" y="276" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#15803d" text-anchor="middle">w1</text><line x1="590" y1="218" x2="636" y2="258" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="608" y="258" width="56" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.2"/><text x="636" y="276" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#15803d" text-anchor="middle">w2</text><line x1="810" y1="218" x2="764" y2="258" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="736" y="258" width="56" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.2"/><text x="764" y="276" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#15803d" text-anchor="middle">w3</text><line x1="810" y1="218" x2="856" y2="258" stroke="#9aa4ae" stroke-width="1.3" stroke-linecap="round"/><rect x="828" y="258" width="56" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.2"/><text x="856" y="276" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#15803d" text-anchor="middle">w4</text><text x="700" y="330" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">✔ strong built-in regularization</text><text x="700" y="352" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle">✔ prediction = ONE array lookup</text><rect x="28" y="388" width="904" height="76" rx="10" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="50" y="412" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="start">Why inference is 10–50× faster</text><text x="50" y="438" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" fill="#1f2328" text-anchor="start">Age&lt;30 = TRUE(1) · Income&lt;50k = FALSE(0) · Score&gt;7 = TRUE(1)   ⟹   binary 101  =  5   ⟹   leaf_values[5]</text><text x="50" y="456" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">no branching, no if-else chain — the path IS the index</text></svg>