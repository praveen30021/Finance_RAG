<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Random Forest versus Extra Trees split selection"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Random Forest vs Extra Trees — how the split threshold is chosen</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Same feature, same data. The difference is how hard each one searches for the cut point.</text><rect x="30" y="78" width="400" height="274" rx="10" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><text x="230" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">RANDOM FOREST — search for the BEST cut</text><text x="230" y="120" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="middle">sort the values, evaluate every candidate, keep the best</text><line x1="70" y1="170" x2="390" y2="170" stroke="#1f2328" stroke-width="1.7" stroke-linecap="round"/><circle cx="89.2" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="111.6" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="130.8" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="159.60000000000002" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="178.8" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="217.20000000000002" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="246.0" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="265.2" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="300.4" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="329.20000000000005" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="351.6" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="374.0" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><text x="70" y="194" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">feature value  ──▶</text><line x1="100.4" y1="154" x2="100.4" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="121.2" y1="154" x2="121.2" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="145.2" y1="154" x2="145.2" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="169.20000000000002" y1="154" x2="169.20000000000002" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="198.0" y1="154" x2="198.0" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="231.6" y1="154" x2="231.6" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="255.60000000000002" y1="154" x2="255.60000000000002" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="282.8" y1="154" x2="282.8" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="314.8" y1="154" x2="314.8" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="340.4" y1="154" x2="340.4" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="362.8" y1="154" x2="362.8" y2="180" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="231.6" y1="136" x2="231.6" y2="186" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/><text x="231.6" y="128" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">best gain</text><text x="230" y="262" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">11 candidate cuts evaluated</text><text x="230" y="282" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">cost: sorting + a full scan, per feature, per node</text><text x="230" y="318" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">lower bias · higher variance · slower</text><rect x="470" y="78" width="400" height="274" rx="10" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><text x="670" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">EXTRA TREES — draw RANDOM cuts, keep the best of those</text><text x="670" y="120" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="middle">no sorting at all — far cheaper, and more random</text><line x1="510" y1="170" x2="830" y2="170" stroke="#1f2328" stroke-width="1.7" stroke-linecap="round"/><circle cx="529.2" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="551.6" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="570.8" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="599.6" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="618.8" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="657.2" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="686.0" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="705.2" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="740.4" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="769.2" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="791.6" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="814.0" cy="170" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><text x="510" y="194" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">feature value  ──▶</text><line x1="580.4" y1="154" x2="580.4" y2="180" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/><text x="580.4" y="148" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">r1</text><line x1="666.8" y1="154" x2="666.8" y2="180" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/><text x="666.8" y="148" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">r2</text><line x1="756.4" y1="154" x2="756.4" y2="180" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/><text x="756.4" y="148" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">r3</text><line x1="666.8" y1="136" x2="666.8" y2="186" stroke="#15803d" stroke-width="2.8" stroke-linecap="round"/><text x="666.8" y="128" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">best of the 3</text><text x="670" y="262" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">3 RANDOM cuts, best of those</text><text x="670" y="282" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">cost: no sorting — just evaluate a handful</text><text x="670" y="318" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">higher bias · lower variance · much faster</text><text x="450" y="382" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#57606a" text-anchor="middle">Extra Trees also skips bootstrapping — each tree sees the full dataset.</text></svg>