<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Histogram binning and the subtraction trick"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">LightGBM — Histogram Binning and the Subtraction Trick</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Continuous values become ~255 integer bins; then every child histogram is half price</text><text x="36" y="92" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">① BINNING  —  from millions of split points to 255</text><line x1="60" y1="128" x2="620" y2="128" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><circle cx="91.99999999999997" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="102.66666666666666" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="140.0" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="150.66666666666669" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="236.0" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="251.99999999999997" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="294.6666666666667" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="364.0" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="385.3333333333333" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="481.3333333333333" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="513.3333333333333" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><circle cx="582.6666666666666" cy="128" r="4.6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><text x="60" y="150" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">raw feature values — every midpoint is a candidate split (slow)</text><rect x="62.0" y="196" width="108.0" height="36" rx="5" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="116.0" y="219" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">bin 0</text><rect x="174.0" y="196" width="108.0" height="36" rx="5" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="228.0" y="219" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">bin 1</text><rect x="286.0" y="196" width="108.0" height="36" rx="5" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="340.0" y="219" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">bin 2</text><rect x="398.0" y="196" width="108.0" height="36" rx="5" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="452.0" y="219" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">bin 3</text><rect x="510.0" y="196" width="108.0" height="36" rx="5" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="564.0" y="219" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">bin 4</text><line x1="91.99999999999997" y1="134" x2="91.99999999999997" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="91.99999999999997" cy="192" r="3" fill="#6b7280"/><line x1="102.66666666666666" y1="134" x2="102.66666666666666" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="102.66666666666666" cy="192" r="3" fill="#6b7280"/><line x1="140.0" y1="134" x2="140.0" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="140.0" cy="192" r="3" fill="#6b7280"/><line x1="150.66666666666669" y1="134" x2="150.66666666666669" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="150.66666666666669" cy="192" r="3" fill="#6b7280"/><line x1="236.0" y1="134" x2="236.0" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="236.0" cy="192" r="3" fill="#6b7280"/><line x1="251.99999999999997" y1="134" x2="251.99999999999997" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="251.99999999999997" cy="192" r="3" fill="#6b7280"/><line x1="294.6666666666667" y1="134" x2="294.6666666666667" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="294.6666666666667" cy="192" r="3" fill="#6b7280"/><line x1="364.0" y1="134" x2="364.0" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="364.0" cy="192" r="3" fill="#6b7280"/><line x1="385.3333333333333" y1="134" x2="385.3333333333333" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="385.3333333333333" cy="192" r="3" fill="#6b7280"/><line x1="481.3333333333333" y1="134" x2="481.3333333333333" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="481.3333333333333" cy="192" r="3" fill="#6b7280"/><line x1="513.3333333333333" y1="134" x2="513.3333333333333" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="513.3333333333333" cy="192" r="3" fill="#6b7280"/><line x1="582.6666666666666" y1="134" x2="582.6666666666666" y2="192" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="582.6666666666666" cy="192" r="3" fill="#6b7280"/><text x="60" y="248" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="start">only 4 candidate split points left  ⟹  O(#bins) instead of O(#rows)</text><rect x="650" y="120" width="276" height="120" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="788.0" y="159.375" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">What each bin stores</text><text x="788.0" y="175.875" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle"></text><text x="788.0" y="192.375" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">Σ gradients   and   Σ hessians</text><text x="788.0" y="208.875" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">(two numbers — that's all)</text><text x="788" y="258" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#57606a" text-anchor="middle">no sorting · 8× less memory</text><line x1="36" y1="286" x2="924" y2="286" stroke="#e4e8ec" stroke-width="1.3" stroke-linecap="round"/><text x="36" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="start">② THE SUBTRACTION TRICK  —  build the small child, get the big one free</text><rect x="386" y="336" width="190" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="481.0" y="357.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">PARENT node</text><text x="481.0" y="374.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">histogram H(parent)</text><path d="M 440 388 V 410 H 230 V 430" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 520 388 V 410 H 740 V 430" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="130" y="430" width="200" height="58" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="230.0" y="454.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">SMALLER child</text><text x="230.0" y="471.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">build it — cheap</text><rect x="640" y="430" width="200" height="58" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="740.0" y="454.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">LARGER child</text><text x="740.0" y="471.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">FREE by subtraction</text><text x="230" y="504" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">cost ∝ its own row count</text><text x="740" y="504" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">H(large) = H(parent) − H(small)</text><rect x="356" y="430" width="250" height="58" rx="9" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="481" y="452" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">H(parent) = H(left) + H(right)</text><text x="481" y="472" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="middle">so you only ever build the cheaper one</text></svg>