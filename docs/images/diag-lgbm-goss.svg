<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Gradient-based One-Side Sampling"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="480" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">LightGBM — GOSS (Gradient-based One-Side Sampling)</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Keep every hard row. Sample the easy ones. Then scale them back up so nothing is distorted.</text><text x="40" y="94" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="start">all N rows, sorted by |gradient| (descending)</text><rect x="41.5" y="104.0" width="11.705882352941176" height="150.0" rx="2" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><rect x="56.205882352941174" y="114.50610802218654" width="11.705882352941176" height="139.49389197781346" rx="2" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><rect x="70.91176470588235" y="124.24570003205466" width="11.705882352941176" height="129.75429996794534" rx="2" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><rect x="85.61764705882354" y="133.27470033534155" width="11.705882352941176" height="120.72529966465846" rx="2" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><rect x="100.3235294117647" y="141.64495305169308" width="11.705882352941176" height="112.35504694830692" rx="2" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><rect x="115.02941176470588" y="149.40451980130166" width="11.705882352941176" height="104.59548019869835" rx="2" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><rect x="129.73529411764707" y="156.