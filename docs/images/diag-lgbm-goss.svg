troke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="306.20588235294116" y="211.17500097251352" width="11.705882352941176" height="42.824999027486484" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="320.9117647058823" y="213.86171915098356" width="11.705882352941176" height="40.13828084901644" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="335.61764705882354" y="216.3524168335635" width="11.705882352941176" height="37.64758316643651" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="350.3235294117647" y="218.66139549597816" width="11.705882352941176" height="35.33860450402184" rx="2" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><rect x="365.02941176470586" y="220.8019131913911" width="11.705882352941176" height="33.198086808608906" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="379.735294117647" y="222.78626067755812" width="11.705882352941176" height="31.21373932244187" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="394.44117647058823" y="224.62583198981386" width="11.705882352941176" height="29.374168010186136" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="409.1470588235294" y="226.3311898651177" width="11.705882352941176" height="27.668810134882296" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="423.85294117647055" y="227.91212639282134" width="11.705882352941176" height="26.08787360717866" rx="2" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><rect x="438.55882352941177" y="229.37771924041195" width="11.705882352941176" height="24.622280759588044" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="453.2647058823529" y="230.73638377707667" width="11.705882352941176" height="23.263616222923336" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="467.9705882352941" y="231.99592139437948" width="11.705882352941176" height="22.004078605620528" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="482.67647058823525" y="233.16356430150597" width="11.705882352941176" height="20.836435698494043" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="497.38235294117646" y="234.24601705228793" width="11.705882352941176" height="19.753982947712075" rx="2" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><rect x="512.0882352941176" y="235.2494950424544" width="11.705882352941176" height="18.750504957545587" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><rect x="526.7941176470588" y="236.17976019815856" width="11.705882352941176" height="17.820239801841428" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" opacity="0.5"/><line x1="40" y1="254" x2="540" y2="254" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"/><line x1="142.94117647058823" y1="100" x2="142.94117647058823" y2="260" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><text x="92" y="276" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="middle">TOP  a = 20%</text><text x="92" y="292" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">keep ALL</text><text x="360" y="276" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">REST  (1 − a) = 80%</text><text x="360" y="292" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">randomly keep only b = 10% of N  (shaded)</text><rect x="570" y="92" width="366" height="176" rx="11" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="590" y="118" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b45309" text-anchor="start">The compensation (why GOSS is unbiased)</text><text x="590" y="146" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start">the rest group SHOULD count for  (1 − a)</text><text x="590" y="166" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start">but we only sampled               b</text><line x1="590" y1="180" x2="916" y2="180" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="753" y="214" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">amplify sampled gradients ×  (1 − a) / b</text><text x="753" y="244" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2328" text-anchor="middle">a = 0.2, b = 0.1   ⟹   ×  0.8 / 0.1  =  8</text><rect x="40" y="304" width="896" height="160" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><text x="62" y="330" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Worked example — N = 10,000 rows</text><circle cx="74" cy="352" r="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="74" y="356" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">1</text><text x="92" y="356" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start">sort all 10,000 rows by |gradient|</text><circle cx="74" cy="374" r="9" fill="#fdeee7" stroke="#c2410c" stroke-width="1.4"/><text x="74" y="378" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">2</text><text x="92" y="378" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start">Set A = top 20%  →  2,000 rows kept in full</text><circle cx="74" cy="396" r="9" fill="#fff7e6" stroke="#b45309" stroke-width="1.4"/><text x="74" y="400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">3</text><text x="92" y="400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start">Set B = random 10% of N from the remaining 8,000  →  1,000 rows</text><circle cx="74" cy="418" r="9" fill="#fff7e6" stroke="#b45309" stroke-width="1.4"/><text x="74" y="422" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">4</text><text x="92" y="422" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start">multiply those 1,000 rows' gradients by (1−0.2)/0.1 = 8</text><circle cx="74" cy="440" r="9" fill="#eefbf1" stroke="#15803d" stroke-width="1.4"/><text x="74" y="444" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">5</text><text x="92" y="444" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start">build the histogram from 3,000 rows  →  ~3× faster, almost no accuracy loss</text></svg>