t><text x="441.0" y="230.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">Mumbai_Desktop</text><text x="441.0" y="247.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">Chennai_Mobile</text><text x="441.0" y="264.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">…</text><line x1="562" y1="201" x2="600" y2="201" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="581" y="191" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#6d28d9" text-anchor="middle">Ordered TS</text><rect x="606" y="152" width="262" height="98" rx="8" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="737.0" y="179.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">a single NUMERIC column</text><text x="737.0" y="196.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle"></text><text x="737.0" y="213.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">0.73,  0.41,  0.88,  …</text><text x="737.0" y="230.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">leakage-free, as always</text><rect x="60" y="310" width="808" height="54" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="80" y="332" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Why this matters:</text><text x="80" y="350" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="start">it captures interactions a human would otherwise have to engineer by hand. Done greedily at each split, controlled by max_ctr_complexity (default 4).</text></svg>