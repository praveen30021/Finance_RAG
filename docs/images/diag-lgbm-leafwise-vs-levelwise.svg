<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Level-wise versus leaf-wise tree growth"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Level-wise (XGBoost) vs Leaf-wise (LightGBM) Tree Growth</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Same budget of 4 leaves — leaf-wise spends them all on the splits that reduce loss the most</text><rect x="24" y="80" width="452" height="402" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><rect x="24" y="80" width="452" height="34" rx="11" fill="#eef4ff"/><rect x="24" y="98" width="452" height="16" rx="0" fill="#eef4ff"/><text x="250" y="103" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#2563eb" text-anchor="middle">LEVEL-WISE  (depth-wise)</text><text x="250" y="134" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="middle">split EVERY node at the current depth</text><line x1="250" y1="185" x2="160" y2="221" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="250" y1="185" x2="340" y2="221" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="160" y1="255" x2="112" y2="291" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="160" y1="255" x2="208" y2="291" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="340" y1="255" x2="292" y2="291" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="340" y1="255" x2="388" y2="291" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="250" cy="168" r="17" fill="#eef4ff" stroke="#2563eb" stroke-width="2.1"/><circle cx="160" cy="238" r="17" fill="#eef4ff" stroke="#2563eb" stroke-width="2.1"/><circle cx="340" cy="238" r="17" fill="#eef4ff" stroke="#2563eb" stroke-width="2.1"/><circle cx="112" cy="308" r="17" fill="#eef4ff" stroke="#2563eb" stroke-width="2.1"/><text x="112" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">leaf</text><circle cx="208" cy="308" r="17" fill="#eef4ff" stroke="#2563eb" stroke-width="2.1"/><text x="208" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">leaf</text><circle cx="292" cy="308" r="17" fill="#eef4ff" stroke="#2563eb" stroke-width="2.1"/><text x="292" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">leaf</text><circle cx="388" cy="308" r="17" fill="#eef4ff" stroke="#2563eb" stroke-width="2.1"/><text x="388" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">leaf</text><text x="250" y="352" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">balanced  ·  depth 2  ·  4 leaves</text><rect x="56" y="376" width="388" height="86" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="74" y="400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">✔ naturally regularized, hard to overfit</text><text x="74" y="420" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">✘ wastes splits on nodes with tiny gain</text><text x="74" y="444" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="start">num_leaves = 2^depth</text><rect x="492" y="80" width="444" height="402" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><rect x="492" y="80" width="444" height="34" rx="11" fill="#eefbf1"/><rect x="492" y="98" width="444" height="16" rx="0" fill="#eefbf1"/><text x="714" y="103" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#15803d" text-anchor="middle">LEAF-WISE  (best-first)</text><text x="714" y="134" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="middle">split only the leaf with the MAXIMUM gain</text><line x1="714" y1="185" x2="628" y2="221" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="714" y1="185" x2="806" y2="221" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="628" y1="255" x2="574" y2="291" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="628" y1="255" x2="676" y2="291" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="676" y1="325" x2="628" y2="361" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><line x1="676" y1="325" x2="726" y2="361" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="714" cy="168" r="17" fill="#eefbf1" stroke="#15803d" stroke-width="2.1"/><circle cx="628" cy="238" r="17" fill="#eefbf1" stroke="#15803d" stroke-width="2.1"/><circle cx="806" cy="238" r="17" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.6"/><text x="806" y="242" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">leaf</text><circle cx="574" cy="308" r="17" fill="#eefbf1" stroke="#15803d" stroke-width="2.1"/><text x="574" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">leaf</text><circle cx="676" cy="308" r="17" fill="#eefbf1" stroke="#15803d" stroke-width="2.1"/><circle cx="628" cy="378" r="17" fill="#eefbf1" stroke="#15803d" stroke-width="2.1"/><text x="628" y="382" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">leaf</text><circle cx="726" cy="378" r="17" fill="#eefbf1" stroke="#15803d" stroke-width="2.1"/><text x="726" y="382" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">leaf</text><text x="846" y="243" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="start">gain too</text><text x="846" y="256" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606a" text-anchor="start">small → stop</text><text x="714" y="420" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">unbalanced  ·  depth 3  ·  4 leaves, LOWER loss</text><rect x="524" y="376" width="380" height="86" rx="9" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="542" y="400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">✔ lower loss per leaf, converges faster</text><text x="542" y="420" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">✘ overfits SMALL data — cap num_leaves</text><text x="542" y="444" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="start">keep  num_leaves &lt; 2^max_depth</text></svg>