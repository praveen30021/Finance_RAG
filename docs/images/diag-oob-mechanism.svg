#2563eb" text-anchor="middle">in-bag</text><rect x="521" y="284" width="84" height="32" rx="6" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/><text x="564.0" y="305" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">in-bag</text><rect x="613" y="284" width="84" height="32" rx="6" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/><text x="656.0" y="305" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">in-bag</text><rect x="335" y="197" width="88" height="38" rx="8" fill="none" stroke="#15803d" stroke-width="2.6"/><rect x="611" y="197" width="88" height="38" rx="8" fill="none" stroke="#15803d" stroke-width="2.6"/><text x="426" y="348" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">row 3 was OOB for Tree 3 and Tree 6  ⟹  only those two predict it</text><rect x="36" y="398" width="828" height="56" rx="9" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="56" y="420" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">Do this for every row, compare against the true labels  ⟹  the OOB score.</text><text x="56" y="440" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start">It behaves like cross-validation but costs nothing — it falls out of the bootstrap itself.</text></svg>