<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="How the OOB score is computed"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">How the Out-of-Bag Score Works</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Every row is scored only by the ~37% of trees that never trained on it — free validation</text><text x="196.0" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">Tree 1</text><text x="288.0" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">Tree 2</text><text x="380.0" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">Tree 3</text><text x="472.0" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">Tree 4</text><text x="564.0" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">Tree 5</text><text x="656.0" y="102" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">Tree 6</text><text x="136" y="138" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f2328" text-anchor="end">row 1</