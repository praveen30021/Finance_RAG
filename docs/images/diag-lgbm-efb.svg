" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle">1</text><rect x="44" y="244" width="98" height="26" rx="5" fill="#fdeee7" stroke="#c2410c" stroke-width="1.3"/><text x="93.0" y="262" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle">1</text><rect x="148" y="244" width="98" height="26" rx="5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1.3"/><text x="197.0" y="262" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" fill="#57606a" text-anchor="middle">0</text><rect x="252" y="244" width="98" height="26" rx="5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1.3"/><text x="301.0" y="262" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" fill="#57606a" text-anchor="middle">0</text><rect x="44" y="274" width="98" height="26" rx="5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1.3"/><text x="93.0" y="292" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" fill="#57606a" text-anchor="middle">0</text><rect x="148" y="274" width="98" height="26" rx="5" fill="#ffffff" stroke="#e4e8ec" stroke-width="1.3"/><text x="197.0" y="292" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" fill="#57606a" text-anchor="middle">0</text><rect x="252" y="274" width="98" height="26" rx="5" fill="#fdeee7" stroke="#c2410c" stroke-width="1.3"/><text x="301.0" y="292" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle">1</text><text x="44" y="324" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="start">exactly ONE is non-zero per row  ⟹  mutually exclusive</text><line x1="378" y1="250" x2="432" y2="250" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="405" y="236" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">bundle</text><text x="452" y="86" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="start">AFTER  —  1 bundled column, 1 histogram</text><rect x="452" y="118" width="150" height="30" rx="6" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="527" y="138" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">city_bundle</text><rect x="452" y="154" width="150" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.3"/><text x="527" y="172" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">1</text><rect x="452" y="184" width="150" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.3"/><text x="527" y="202" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">11</text><rect x="452" y="214" width="150" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.3"/><text x="527" y="232" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">21</text><rect x="452" y="244" width="150" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.3"/><text x="527" y="262" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">1</text><rect x="452" y="274" width="150" height="26" rx="5" fill="#eefbf1" stroke="#15803d" stroke-width="1.3"/><text x="527" y="292" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">21</text><rect x="630" y="118" width="306" height="196" rx="11" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="650" y="144" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">The offset trick (lossless)</text><rect x="650" y="174" width="118" height="24" rx="5" fill="#fdeee7" stroke="#c2410c" stroke-width="1.3"/><text x="709" y="191" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">values  1 – 10</text><text x="780" y="191" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">were is_Delhi</text><rect x="650" y="208" width="118" height="24" rx="5" fill="#fff7e6" stroke="#b45309" stroke-width="1.3"/><text x="709" y="225" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">values 11 – 20</text><text x="780" y="225" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">were is_Mumbai</text><rect x="650" y="242" width="118" height="24" rx="5" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.3"/><text x="709" y="259" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" font-weight="600" fill="#6d28d9" text-anchor="middle">values 21 – 30</text><text x="780" y="259" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">were is_Chennai</text><text x="650" y="294" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">disjoint ranges ⟹ the split finder can still</text><text x="650" y="309" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">recover the original feature. Zero info lost.</text><rect x="44" y="364" width="892" height="86" rx="10" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="66" y="390" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start">Choosing the bundles = GRAPH COLOURING (NP-hard) → LightGBM uses a greedy algorithm</text><text x="66" y="412" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="start">vertices = features · edge weight = how often two features CONFLICT (both non-zero in a row)</text><text x="66" y="433" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start">O(#data × #features)   ⟶   O(#data × #bundles)        a small conflict rate γ is allowed; error is bounded by O(γ)</text></svg>