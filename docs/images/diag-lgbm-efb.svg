<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Exclusive Feature Bundling"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">LightGBM — EFB (Exclusive Feature Bundling)</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Sparse one-hot columns are never non-zero together, so they can share ONE slot via disjoint value ranges</text><text x="44" y="86" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c2410c" text-anchor="start">BEFORE  —  3 sparse columns, 3 histograms</text><rect x="44" y="118" width="98" height="30" rx="6" fill="#fdeee7" stroke="#c2410c" stroke-width="1.6"/><text x="93.0" y="138" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">is_Delhi</text><rect x="148" y="118" width="98" height="30" rx="6" fill="#fdeee7" stroke="#c2410c" stroke-width="1.6"/><text x="197.0" y="138" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">is_Mumbai</text><rect x="252" y="118" width="98" height="30" rx="6" fill="#fdeee7" stroke="#c2410c" stroke-width="1.6"/><text x="301.0" y="138" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">is_Chennai</text><rect x="44" y="154" width="98" height="26" rx="5" fill="#fdeee7" stroke="#c2410c" stroke-width="1.3"/><text x="93.0" y="172" font-famil