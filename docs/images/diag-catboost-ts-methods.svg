<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Four ways to encode a categorical feature"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="440" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">CatBoost — Four Ways to Turn a Category into a Number</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Three of them leak the target. Only the fourth is safe.</text><rect x="28" y="86" width="222" height="274" rx="10" fill="#fcfcfd" stroke="#c2410c" stroke-width="1.6"/><rect x="28" y="86" width="222" height="34" rx="10" fill="#fdeee7"/><rect x="28" y="104" width="222" height="16" rx="0" fill="#fdeee7"/><text x="139.0" y="108" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c2410c" text-anchor="middle">GREEDY TS</text><text x="139.0" y="142" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">how it works</text><text x="139.0" y="162" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle">uses the WHOLE dataset,</text><text x="139.0" y="178" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle">including row i's own label</text><line x1="42" y1="206" x2="236" y2="206" stroke="#e4e8ec" stroke-width="1.2" stroke-linecap="round"/><text x="139.0" y="228" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">verdict</text><text x="139.0" y="248" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#c2410c" text-anchor="middle">✘ leaks badly — with unique IDs</text><text x="139.0" y="264" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#c2410c" text-anchor="middle">the encoding literally becomes y</text><rect x="50" y="300" width="24" height="22" rx="4" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><text x="62" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#c2410c" text-anchor="middle">1</text><rect x="80" y="300" width="24" height="22" rx="4" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><text x="92" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#c2410c" text-anchor="middle">2</text><rect x="110" y="300" width="24" height="22" rx="4" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><text x="122" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#c2410c" text-anchor="middle">3</text><rect x="140" y="300" width="24" height="22" rx="4" fill="#fdeee7" stroke="#c2410c" stroke-width="2.2"/><text x="152" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" font-weight="600" fill="#c2410c" text-anchor="middle">4</text><rect x="170" y="300" width="24" height="22" rx="4" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><text x="182" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#c2410c" text-anchor="middle">5</text><rect x="200" y="300" width="24" height="22" rx="4" fill="#fdeee7" stroke="#c2410c" stroke-width="1.2"/><text x="212" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#c2410c" text-anchor="middle">6</text><text x="139.0" y="342" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a" text-anchor="middle">bold = the row being encoded</text><rect x="264" y="86" width="222" height="274" rx="10" fill="#fcfcfd" stroke="#b45309" stroke-width="1.6"/><rect x="264" y="86" width="222" height="34" rx="10" fill="#fff7e6"/><rect x="264" y="104" width="222" height="16" rx="0" fill="#fff7e6"/><text x="375.0" y="108" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">HOLDOUT TS</text><text x="375.0" y="142" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">how it works</text><text x="375.0" y="162" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle">split the data; compute the</text><text x="375.0" y="178" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle">statistic on part A only</text><line x1="278" y1="206" x2="472" y2="206" stroke="#e4e8ec" stroke-width="1.2" stroke-linecap="round"/><text x="375.0" y="228" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">verdict</text><text x="375.0" y="248" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">✘ wastes data — part A is lost</text><text x="375.0" y="264" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309" text-anchor="middle">for training, part B for encoding</text><rect x="286" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="298" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">1</text><rect x="316" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="328" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">2</text><rect x="346" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="358" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">3</text><rect x="376" y="300" width="24" height="22" rx="4" fill="#ffffff" stroke="#d8dee4" stroke-width="2.2"/><text x="388" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" font-weight="600" fill="#57606a" text-anchor="middle">4</text><rect x="406" y="300" width="24" height="22" rx="4" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="418" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#57606a" text-anchor="middle">5</text><rect x="436" y="300" width="24" height="22" rx="4" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="448" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#57606a" text-anchor="middle">6</text><text x="375.0" y="342" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a" text-anchor="middle">bold = the row being encoded</text><rect x="500" y="86" width="222" height="274" rx="10" fill="#fcfcfd" stroke="#b45309" stroke-width="1.6"/><rect x="500" y="86" width="222" height="34" rx="10" fill="#fff7e6"/><rect x="500" y="104" width="222" height="16" rx="0" fill="#fff7e6"/><text x="611.0" y="108" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">LEAVE-ONE-OUT TS</text><text x="611.0" y="142" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">how it works</text><text x="611.0" y="162" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle">use every row EXCEPT row i</text><line x1="514" y1="206" x2="708" y2="206" stroke="#e4e8ec" stroke-width="1.2" stroke-linecap="round"/><text x="611.0" y="228" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">verdict</text><text x="611.0" y="248" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">✘ still leaks — for a binary target</text><text x="611.0" y="264" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309" text-anchor="middle">the model can invert it and recover y</text><rect x="522" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="534" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">1</text><rect x="552" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="564" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">2</text><rect x="582" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="594" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">3</text><rect x="612" y="300" width="24" height="22" rx="4" fill="#ffffff" stroke="#d8dee4" stroke-width="2.2"/><text x="624" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" font-weight="600" fill="#57606a" text-anchor="middle">4</text><rect x="642" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="654" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">5</text><rect x="672" y="300" width="24" height="22" rx="4" fill="#fff7e6" stroke="#b45309" stroke-width="1.2"/><text x="684" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#b45309" text-anchor="middle">6</text><text x="611.0" y="342" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a" text-anchor="middle">bold = the row being encoded</text><rect x="736" y="86" width="222" height="274" rx="10" fill="#fcfcfd" stroke="#15803d" stroke-width="1.6"/><rect x="736" y="86" width="222" height="34" rx="10" fill="#eefbf1"/><rect x="736" y="104" width="222" height="16" rx="0" fill="#eefbf1"/><text x="847.0" y="108" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">ORDERED TS</text><text x="847.0" y="142" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">how it works</text><text x="847.0" y="162" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle">use only the rows BEFORE row i</text><text x="847.0" y="178" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2328" text-anchor="middle">in a random permutation σ</text><line x1="750" y1="206" x2="944" y2="206" stroke="#e4e8ec" stroke-width="1.2" stroke-linecap="round"/><text x="847.0" y="228" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="middle">verdict</text><text x="847.0" y="248" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">✔ no leakage, no wasted data</text><text x="847.0" y="264" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#15803d" text-anchor="middle">CatBoost's answer</text><rect x="758" y="300" width="24" height="22" rx="4" fill="#eefbf1" stroke="#15803d" stroke-width="1.2"/><text x="770" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#15803d" text-anchor="middle">1</text><rect x="788" y="300" width="24" height="22" rx="4" fill="#eefbf1" stroke="#15803d" stroke-width="1.2"/><text x="800" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#15803d" text-anchor="middle">2</text><rect x="818" y="300" width="24" height="22" rx="4" fill="#eefbf1" stroke="#15803d" stroke-width="1.2"/><text x="830" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#15803d" text-anchor="middle">3</text><rect x="848" y="300" width="24" height="22" rx="4" fill="#ffffff" stroke="#d8dee4" stroke-width="2.2"/><text x="860" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" font-weight="600" fill="#57606a" text-anchor="middle">4</text><rect x="878" y="300" width="24" height="22" rx="4" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="890" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#57606a" text-anchor="middle">5</text><rect x="908" y="300" width="24" height="22" rx="4" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="920" y="316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" fill="#57606a" text-anchor="middle">6</text><text x="847.0" y="342" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a" text-anchor="middle">bold = the row being encoded</text><text x="480" y="400" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">All four use the same smoothed formula:   x̂ = ( Σ y over the chosen rows + a·P ) / ( count + a )</text><text x="480" y="420" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#57606a" text-anchor="middle">they differ only in WHICH rows are allowed into that sum.</text></svg>