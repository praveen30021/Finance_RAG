<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="Sparsity-aware split finding"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="900" height="350" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">XGBoost — Sparsity-Aware Split Finding (missing values)</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">XGBoost does not impute. It LEARNS a default direction per split.</text><rect x="360" y="84" width="180" height="44" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="450.0" y="110.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">node:  f &gt; 4.5 ?</text><path d="M 420 128 V 158 H 250 V 186" fill="none" stroke="#9aa4ae" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 480 128 V 158 H 650 V 186" fill="none" stroke="#9aa4ae" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="320" y="152" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606a" text-anchor="start">no</text><text x="566" y="152" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606a" text-anchor="start">yes</text><rect x="170" y="186" width="160" height="44" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="250.0" y="212.5" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">LEFT child</text><rect x="570" y="186" width="160" height="44" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="650.0" y="212.5" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">RIGHT child</text><rect x="366" y="186" width="168" height="44" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/><text x="450" y="213" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">rows with f = NaN</text><path d="M 366 208 H 336" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M 534 208 H 564" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="300" y="252" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#57606a" text-anchor="middle">Option A: gain = 11.4</text><text x="620" y="252" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">Option B: gain = 18.1</text><rect x="258" y="272" width="384" height="52" rx="9" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="450" y="294" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">B wins ⟹ store "default direction = RIGHT" on this node</text><text x="450" y="313" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">every split learns its own default — no preprocessing needed</text></svg>