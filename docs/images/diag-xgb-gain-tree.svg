<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="XGBoost similarity score and gain"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">XGBoost — Building a Tree with Similarity Score and Gain</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Worked example from Part 6.4  ·  residuals [−2.8, −1.3, +0.7, +3.7], λ = 0</text><rect x="387.0" y="92" width="186" height="70" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="480" y="112" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1f2328" text-anchor="middle">[−2.8, −1.3, +0.7, +3.7]</text><text x="480" y="132" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">SS_root = (0.3)²/4 = 0.02</text><text x="60" y="196" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#57606a" text-anchor="start">try every split:</text><rect x="196" y="176" width="222" height="46" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.4"/><text x="307" y="196" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#57606a" text-anchor="middle">CGPA &lt; 5.0</text><text x="307" y="213" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">Gain = 11.02</text><rect x="446" y="176" width="222" height="46" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="2.2"/><text x="557" y="196" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">CGPA &lt; 6.75</text><text x="557" y="213" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">Gain = 18.065   ★ WINNER</text><rect x="696" y="176" width="222" height="46" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.4"/><text x="807" y="196" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" font-weight="600" fill="#57606a" text-anchor="middle">CGPA &lt; 8.25</text><text x="807" y="213" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">Gain = 17.52</text><path d="M 480 162 V 176" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 480 222 V 252" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="392" y="252" width="176" height="38" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="480.0" y="275.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">CGPA &lt; 6.75 ?</text><path d="M 430 290 V 316 H 236 V 338" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 530 290 V 316 H 724 V 338" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="310" y="310" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="start">yes</text><text x="640" y="310" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="start">no</text><rect x="143.0" y="338" width="186" height="70" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="236" y="358" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1f2328" text-anchor="middle">[−2.8, −1.3]</text><text x="236" y="378" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">SS = (−4.1)²/2 = 8.405</text><rect x="631.0" y="338" width="186" height="70" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="724" y="358" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1f2328" text-anchor="middle">[+0.7, +3.7]</text><text x="724" y="378" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">SS = (4.4)²/2 = 9.68</text><text x="724" y="397" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">output = 4.4/2 = +2.2</text><rect x="28" y="424" width="904" height="0" rx="8" fill="none" stroke="none" stroke-width="1.6"/><text x="28" y="440" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.5" fill="#1f2328" text-anchor="start">Similarity Score = (Σ residuals)² / (N + λ)        Gain = SS_left + SS_right − SS_root − γ        Leaf output = Σ residuals / (N + λ)</text><text x="28" y="460" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#57606a" text-anchor="start">The more SIMILAR the residuals in a leaf, the LESS they cancel, the HIGHER the score.</text></svg>