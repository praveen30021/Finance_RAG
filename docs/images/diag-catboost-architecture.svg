<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="CatBoost architecture"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="560" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">CatBoost — Full Training Pipeline</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">One random permutation drives BOTH the categorical encoding and the residual computation</text><rect x="340" y="78" width="280" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="480.0" y="93.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">TRAINING DATA</text><text x="480.0" y="111.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">numerical  +  raw CATEGORICAL columns</text><line x1="480" y1="118" x2="480" y2="136" stroke="#9aa4ae" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300" y="136" width="360" height="44" rx="8" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="480.0" y="153.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">RANDOM PERMUTATIONS  σ₁ … σ₄</text><text x="480.0" y="171.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">an artificial "arrival time" for every row</text><path d="M 420 180 V 200 H 230 V 220" fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 540 180 V 200 H 730 V 220" fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="60" y="220" width="340" height="116" rx="10" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="230" y="242" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.3" font-weight="600" fill="#15803d" text-anchor="middle">ORDERED TARGET STATISTICS</text><text x="230" y="258" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#57606a" text-anchor="middle">fixes leakage in the FEATURES</text><text x="82" y="282" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• categorical value → a number</text><text x="82" y="300" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• computed from rows BEFORE it in σ</text><text x="82" y="318" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• row k's own label yₖ is never used</text><rect x="560" y="220" width="340" height="116" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="730" y="242" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.3" font-weight="600" fill="#2563eb" text-anchor="middle">ORDERED BOOSTING</text><text x="730" y="258" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#57606a" text-anchor="middle">fixes leakage in the GRADIENTS</text><text x="582" y="282" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• rₖ = yₖ − Mₖ₋₁(xₖ)</text><text x="582" y="300" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• Mₖ₋₁ trained only on rows before k</text><text x="582" y="318" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1f2328" text-anchor="start">• row k never shifts its own residual</text><path d="M 230 336 V 356 H 480 V 374" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 730 336 V 356 H 480" fill="none" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="286" y="374" width="388" height="36" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="480.0" y="396.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">+  automatic FEATURE COMBINATIONS   (city × device × …)</text><line x1="480" y1="410" x2="480" y2="428" stroke="#9aa4ae" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="286" y="428" width="388" height="56" rx="8" fill="#e9f7f5" stroke="#0f766e" stroke-width="1.6"/><text x="480.0" y="443.02500000000003" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.3" font-weight="600" fill="#1f2328" text-anchor="middle">BUILD A SYMMETRIC (OBLIVIOUS) TREE</text><text x="480.0" y="460.32500000000005" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.3" fill="#57606a" text-anchor="middle">ONE split condition per LEVEL  ⟹  2^depth leaves</text><text x="480.0" y="477.62500000000006" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.3" fill="#57606a" text-anchor="middle">the tree becomes a lookup table</text><line x1="480" y1="484" x2="480" y2="502" stroke="#9aa4ae" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="340" y="502" width="280" height="32" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="480.0" y="522.25" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">ADD TREE:   Fₘ = Fₘ₋₁ + ν · hₘ</text><path d="M 286 518 H 240 V 456 H 286" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="204" y="490" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="start">repeat</text></svg>