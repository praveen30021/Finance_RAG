<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Bagging tree-level versus Random Forest node-level column sampling"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">The Real Difference: Bagging vs Random Forest</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Both bag the ROWS. The difference is WHERE the COLUMNS are sampled.</text><rect x="24" y="76" width="452" height="376" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><rect x="24" y="76" width="452" height="36" rx="11" fill="#fff7e6"/><rect x="24" y="96" width="452" height="16" rx="0" fill="#fff7e6"/><text x="250" y="100" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="middle">BAGGING  —  TREE-level column sampling</text><rect x="44" y="124" width="259.5" height="23" rx="11.5" fill="#fff7e6" stroke="#b45309" stroke-width="1.3"/><text x="173.75" y="140.1" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">pick {X1, X3} ONCE, before building</text><line x1="250" y1="170" x2="250" y2="170" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round"/><rect x="176" y="164" width="148" height="56" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="250" y="184" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="middle">pool: {X1,X3}</text><text x="250" y="204" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">split on X1</text><line x1="250" y1="200" x2="162" y2="268" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round"/><rect x="88" y="268" width="148" height="56" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="162" y="288" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="middle">pool: {X1,X3}</text><text x="162" y="308" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">split on X3</text><line x1="250" y1="200" x2="338" y2="268" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round"/><rect x="264" y="268" width="148" height="56" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="338" y="288" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="middle">pool: {X1,X3}</text><text x="338" y="308" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">split on X1</text><line x1="162" y1="324" x2="110" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="88" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><line x1="162" y1="324" x2="214" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="192" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><line x1="338" y1="324" x2="286" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="264" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><line x1="338" y1="324" x2="390" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="368" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="250" y="396" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#57606a" text-anchor="middle">every node is stuck with the SAME 2 columns</text><rect x="492" y="76" width="444" height="376" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><rect x="492" y="76" width="444" height="36" rx="11" fill="#eefbf1"/><rect x="492" y="96" width="444" height="16" rx="0" fill="#eefbf1"/><text x="714" y="100" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#15803d" text-anchor="middle">RANDOM FOREST  —  NODE-level column sampling</text><rect x="512" y="124" width="231.9" height="23" rx="11.5" fill="#eefbf1" stroke="#15803d" stroke-width="1.3"/><text x="627.95" y="140.1" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">re-draw k columns at EVERY node</text><line x1="716" y1="170" x2="716" y2="170" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round"/><rect x="642" y="164" width="148" height="56" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="716" y="184" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="middle">pool: {X1,X3}</text><text x="716" y="204" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">split on X1</text><line x1="716" y1="200" x2="628" y2="268" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round"/><rect x="554" y="268" width="148" height="56" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="628" y="288" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="middle">pool: {X2,X4}</text><text x="628" y="308" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">split on X4</text><line x1="716" y1="200" x2="804" y2="268" stroke="#9aa4ae" stroke-width="1.6" stroke-linecap="round"/><rect x="730" y="268" width="148" height="56" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="804" y="288" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#57606a" text-anchor="middle">pool: {X0,X5}</text><text x="804" y="308" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">split on X0</text><line x1="628" y1="324" x2="576" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="554" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><line x1="628" y1="324" x2="680" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="658" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><line x1="804" y1="324" x2="752" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="730" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><line x1="804" y1="324" x2="856" y2="356" stroke="#9aa4ae" stroke-width="1.4" stroke-linecap="round"/><rect x="834" y="356" width="44" height="22" rx="5" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2"/><text x="716" y="396" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#57606a" text-anchor="middle">a FRESH random draw at every single split</text></svg>