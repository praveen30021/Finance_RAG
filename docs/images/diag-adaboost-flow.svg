<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="AdaBoost sequential weight update"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">AdaBoost — Sequential Learning by Re-weighting</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Bigger dot = bigger weight. Each stump is forced to look at what the last one got wrong.</text><rect x="36" y="80" width="272" height="300" rx="11" fill="#fcfcfd" stroke="#e4e8ec" stroke-width="1.6"/><text x="172" y="106" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">Round 1</text><text x="172" y="126" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" text-anchor="middle">weights on the 5 training points</text><circle cx="78" cy="180" r="16" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="78" y="184.5" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">P1</text><circle cx="126" cy="180" r="16" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="126" y="184.5" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">P2</text><circle cx="174" cy="180" r="16" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="174" y="184.5" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" te