<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Gradient boosting classification loop"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Gradient Boosting for Classification — the two-space loop</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">The model lives in LOG-ODDS space; the residuals live in PROBABILITY space. γ is the bridge.</text><rect x="40" y="86" width="370" height="290" rx="11" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="225" y="110" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">LOG-ODDS  space</text><rect x="480" y="86" width="380" height="290" rx="11" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="670" y="110" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">PROBABILITY  space</text><rect x="96" y="128" width="258" height="46" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="225.0" y="146.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">F₀ = ln( N₁ / N₀ )</text><text x="225.0" y="164.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">the initial log-odds</text><line x1="354" y1="151" x2="478" y2="151" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><text x="416" y="142" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">sigmoid</text><rect x="530" y="128" width="280" height="46" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="670.0" y="146.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">p = e^F / (1 + e^F)</text><text x="670.0" y="164.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">predicted probability</text><line x1="670" y1="174" x2="670" y2="198" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="530" y="198" width="280" height="44" rx="8" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="670.0" y="215.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">r = y − p</text><text x="670.0" y="233.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">pseudo-residual</text><line x1="670" y1="242" x2="670" y2="266" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="530" y="266" width="280" height="44" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="670.0" y="283.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">fit a REGRESSION tree to r</text><text x="670.0" y="300.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">leaves = groups of rows</text><path d="M 530 288 H 440 V 330 H 225 V 310" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="400" y="324" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">γ converts the leaf back to log-odds</text><rect x="96" y="256" width="258" height="54" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="225.0" y="278.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">γⱼ = Σ r  /  Σ p(1 − p)</text><text x="225.0" y="296.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">the leaf's value, in log-odds</text><line x1="225" y1="256" x2="225" y2="232" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="96" y="186" width="258" height="46" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="225.0" y="204.625" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Fₘ = Fₘ₋₁ + ν · γ</text><text x="225.0" y="222.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a" text-anchor="middle">update the log-odds</text><path d="M 96 209 H 62 V 151 H 96" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="66" y="180" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">loop</text><rect x="40" y="390" width="820" height="36" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="450" y="413" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">You cannot add a probability-space residual to a log-odds prediction — γ is the only legal bridge between the two.</text></svg>