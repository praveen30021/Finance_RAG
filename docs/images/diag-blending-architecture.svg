<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Blending architecture"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="540" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Blending Architecture — the hold-out method</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">Simpler and cheaper than stacking, but the meta model learns from far fewer rows</text><rect x="170" y="86" width="200" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="270.0" y="107.25" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Original data · 1000 rows</text><path d="M 220 120 V 142 H 130 V 160" fill="none" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 320 120 V 142 H 400 V 160" fill="none" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="60" y="160" width="140" height="32" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="130.0" y="180.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">TRAIN · 800</text><rect x="336" y="160" width="128" height="32" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="400.0" y="180.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">TEST · 200</text><line x1="130" y1="192" x2="130" y2="210" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="42" y="210" width="300" height="62" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="192" y="230" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">split TRAIN again (hold-out)</text><rect x="58" y="238" width="130" height="26" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="123" y="256" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">D_train · 600</text><rect x="198" y="238" width="130" height="26" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="263" y="256" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">D_val · 200</text><path d="M 123 264 V 288 H 150 V 306" fill="none" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="42" y="306" width="300" height="72" rx="9" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="192" y="326" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">train the 3 base models on D_train (600)</text><rect x="70" y="336" width="76" height="26" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text x="108" y="354" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#15803d" text-anchor="middle">LR</text><rect x="160" y="336" width="76" height="26" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text x="198" y="354" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#15803d" text-anchor="middle">DT</text><rect x="250" y="336" width="76" height="26" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text x="288" y="354" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#15803d" text-anchor="middle">KNN</text><text x="192" y="372" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="middle">then PREDICT on D_val (200 unseen rows)</text><path d="M 263 264 V 282 H 392 V 306" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="192" y1="378" x2="192" y2="396" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="42" y="396" width="300" height="58" rx="9" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="192" y="416" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6d28d9" text-anchor="middle">META-DATASET  ·  only 200 rows</text><text x="192" y="434" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2328" text-anchor="middle">[LR_pred, DT_pred, KNN_pred] → y</text><text x="192" y="448" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#c2410c" text-anchor="middle">⚠️ four times smaller than stacking's</text><line x1="192" y1="454" x2="192" y2="472" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="52" y="472" width="280" height="36" rx="8" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="192.0" y="494.25" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">TRAIN THE META MODEL</text><circle cx="566" cy="108" r="13" fill="#6b7280"/><text x="566" y="113" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="590" y="104" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Split 1000 → 800 train / 200 test</text><text x="590" y="120" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start"></text><line x1="566" y1="122" x2="566" y2="144" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="160" r="13" fill="#2563eb"/><text x="566" y="165" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><text x="590" y="156" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Split TRAIN → 600 fit / 200 hold-out</text><text x="590" y="172" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">the hold-out is the key difference</text><line x1="566" y1="174" x2="566" y2="196" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="212" r="13" fill="#15803d"/><text x="566" y="217" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="590" y="208" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Train base models on the 600</text><text x="590" y="224" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">each base model trained ONCE</text><line x1="566" y1="226" x2="566" y2="248" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="264" r="13" fill="#15803d"/><text x="566" y="269" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><text x="590" y="260" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Predict on the 200 unseen rows</text><text x="590" y="276" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">no leakage — they were never trained on</text><line x1="566" y1="278" x2="566" y2="300" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="316" r="13" fill="#6d28d9"/><text x="566" y="321" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">5</text><text x="590" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Train the meta model on those 200</text><text x="590" y="328" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">⚠️ small meta-dataset — easy to overfit</text><line x1="566" y1="330" x2="566" y2="352" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="368" r="13" fill="#b45309"/><text x="566" y="373" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">6</text><text x="590" y="364" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Retrain base models on all 800</text><text x="590" y="380" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">then ship</text><rect x="548" y="416" width="384" height="92" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="740" y="438" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Blending vs Stacking</text><text x="566" y="458" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="start">• cheaper: each base model trained once, not K+1 times</text><text x="566" y="476" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="start">• but the meta model sees 200 rows instead of 800</text><text x="566" y="494" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="start">• and 200 rows of the training data are wasted</text></svg>