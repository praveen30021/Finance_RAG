<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Stacking architecture"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4ae"/></marker></defs><rect width="960" height="580" fill="#ffffff"/><text x="28" y="34" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Stacking Architecture — the K-Fold (out-of-fold) method</text><text x="28" y="55" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="start">The proper way: every meta-feature comes from a model that never saw that row</text><rect x="170" y="86" width="200" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="270.0" y="107.25" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Original data · 1000 rows</text><path d="M 220 120 V 142 H 130 V 160" fill="none" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 320 120 V 142 H 400 V 160" fill="none" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="60" y="160" width="140" height="32" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="130.0" y="180.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">TRAIN · 800</text><rect x="336" y="160" width="128" height="32" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="400.0" y="180.125" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">TEST · 200</text><line x1="130" y1="192" x2="130" y2="212" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="42" y="212" width="410" height="72" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/><text x="247" y="232" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">split TRAIN into K = 4 folds</text><rect x="58" y="242" width="90" height="30" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="103" y="262" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Fold 1</text><text x="103" y="274" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" fill="#57606a" text-anchor="middle">200 rows</text><rect x="156" y="242" width="90" height="30" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="201" y="262" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Fold 2</text><text x="201" y="274" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" fill="#57606a" text-anchor="middle">200 rows</text><rect x="254" y="242" width="90" height="30" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="299" y="262" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Fold 3</text><text x="299" y="274" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" fill="#57606a" text-anchor="middle">200 rows</text><rect x="352" y="242" width="90" height="30" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="397" y="262" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Fold 4</text><text x="397" y="274" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" fill="#57606a" text-anchor="middle">200 rows</text><line x1="247" y1="284" x2="247" y2="302" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="42" y="302" width="410" height="96" rx="9" fill="#eefbf1" stroke="#15803d" stroke-width="1.6"/><text x="247" y="322" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">for EACH base model, run 4-fold CV</text><rect x="58" y="332" width="124" height="26" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text x="120" y="350" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">Linear Regression</text><rect x="190" y="332" width="124" height="26" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text x="252" y="350" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">Decision Tree</text><rect x="322" y="332" width="124" height="26" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text x="384" y="350" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">KNN</text><text x="247" y="376" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2328" text-anchor="middle">train on 3 folds → predict the held-out fold → repeat 4×</text><text x="247" y="390" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">⟹ 800 OUT-OF-FOLD predictions per model</text><line x1="247" y1="398" x2="247" y2="416" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="42" y="416" width="410" height="62" rx="9" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="247" y="436" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6d28d9" text-anchor="middle">META-DATASET  ·  800 rows</text><text x="247" y="454" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2328" text-anchor="middle">columns: [LR_pred, DT_pred, KNN_pred]   target: y</text><text x="247" y="470" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#57606a" text-anchor="middle">the base models' predictions ARE the new features</text><line x1="247" y1="478" x2="247" y2="496" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="96" y="496" width="302" height="40" rx="8" fill="#f4f0ff" stroke="#6d28d9" stroke-width="1.6"/><text x="247.0" y="511.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">TRAIN THE META MODEL (Level-1)</text><text x="247.0" y="528.75" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">e.g. Ridge / Logistic Regression</text><circle cx="566" cy="108" r="13" fill="#6b7280"/><text x="566" y="113" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="590" y="104" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Split 1000 → 800 train / 200 test</text><text x="590" y="120" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">the test set is never touched until the end</text><line x1="566" y1="122" x2="566" y2="144" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="160" r="13" fill="#2563eb"/><text x="566" y="165" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><text x="590" y="156" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Split TRAIN into K = 4 folds</text><text x="590" y="172" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">200 rows each</text><line x1="566" y1="174" x2="566" y2="196" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="212" r="13" fill="#15803d"/><text x="566" y="217" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="590" y="208" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Generate out-of-fold predictions</text><text x="590" y="224" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">each base model trained 4×, predicting the fold it missed</text><line x1="566" y1="226" x2="566" y2="248" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="264" r="13" fill="#6d28d9"/><text x="566" y="269" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><text x="590" y="260" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Assemble the meta-dataset</text><text x="590" y="276" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">800 rows × 3 prediction columns + target</text><line x1="566" y1="278" x2="566" y2="300" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="316" r="13" fill="#6d28d9"/><text x="566" y="321" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">5</text><text x="590" y="312" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Train the META model on it</text><text x="590" y="328" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">it learns HOW to combine the base models</text><line x1="566" y1="330" x2="566" y2="352" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="368" r="13" fill="#b45309"/><text x="566" y="373" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">6</text><text x="590" y="364" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">RETRAIN base models on all 800 rows</text><text x="590" y="380" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">⚠️ meta model FIRST, then retrain the base models</text><line x1="566" y1="382" x2="566" y2="404" stroke="#9aa4ae" stroke-width="1.5" stroke-linecap="round"/><circle cx="566" cy="420" r="13" fill="#0f766e"/><text x="566" y="425" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">7</text><text x="590" y="416" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">Predict: x → base models → meta model</text><text x="590" y="432" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="start">this is the production pipeline</text><rect x="548" y="492" width="384" height="44" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.6"/><text x="740" y="512" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">Models trained: 3 base × 4 folds + 3 final + 1 meta</text><text x="740" y="528" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">= 12 + 3 + 1 = 16 models</text></svg>